[project]
name = "magenta-rt"
description = "Real-time music generation models."
readme = "README.md"
keywords = ["music", "generation", "real-time", "audio", "mlx", "jax", "depthformer"]
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Google LLC"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]

# NOTE(vendoring): Once sequence-layers is on PyPI, add "sequence_layers" and
# remove "typeguard", "jaxtyping", and "recurrentgemma" (pulled in by sequence_layers).
dependencies = [
    "ai-edge-litert",
    "click",
    "numpy",
    "scipy",
    "einops",
    "safetensors",
    "typeguard==2.13.3",
    "jaxtyping",
    "recurrentgemma[jax]>=1.0.1",
    "google-cloud-storage",
    "huggingface_hub",
    "simple-term-menu",
    "librosa",
    "sentencepiece",
    "soundfile",
    # audiotree: the AudioTree pytree is used base-wide (nnx/mlx codecs accept
    # AudioTree); the full sources / excerpt-selection / loudness functionality
    # is used by magenta_rt.sft. Not vendored — see magenta_rt/_vendor/_vendor_hook.py.
    "audiotree>=1.0.0",
]

[tool.uv]
# NOTE(typeguard): typeguard is held at 2.x by the direct `typeguard==2.13.3`
# pin above, and must stay there — `recurrentgemma` (a base dep, pulled in
# everywhere via the vendored sequence-layers) uses jaxtyping's old
# `typeguard.typechecked` pattern, which breaks under ANY typeguard>=3: its
# `*batch`-style shape annotations make typeguard's AST instrumentor raise
# `SyntaxError: invalid syntax` at import, taking down `sequence_layers.jax`/`.mlx`
# (and thus most of the mlx_pure/nnx parity suite). This used to additionally
# need a `typeguard<3` override to beat down tyro's `typeguard>=4`; the [sft]
# extra now uses `argbind-dbraun` (deps: pyyaml + docstring-parser only), so
# nothing asks for typeguard>=3 and the direct pin alone suffices. Re-check if a
# new dependency ever pulls typeguard.
#
# `absl-py`: `recurrentgemma` pins `absl-py>=1,<2` while `audiotree>=1.0` requires
# `absl-py>=2.0`, so the two are unresolvable together without help. absl-py 2.x is
# API-compatible with the surface recurrentgemma actually uses (flags/logging), and
# its `<2` cap is a conservative upper bound rather than a known incompatibility, so
# take the newer one for the whole env.
override-dependencies = ["absl-py>=2.0"]

[tool.uv.sources]
# NOTE(vendoring): submodule moved to magenta_rt/_vendor/sequence-layers.
# Uncomment for local editable development:
# sequence_layers = { path = "magenta_rt/_vendor/sequence-layers", editable = true }

[project.urls]
Repository = "https://github.com/magenta/magenta-realtime"
Issues = "https://github.com/magenta/magenta-realtime/issues"

# NOTE(vendoring): Once sequence-layers is on PyPI, add "sequence-layers[mlx]"
# to mlx (recurrentgemma can then move back to jax-only).
#
# NOTE(jax-everywhere): JAX is a dependency of EVERY install, not just [jax]:
# the base deps pull it via recurrentgemma[jax], and it is also structurally
# required — audiotree's AudioTree is a flax.struct pytree (jax + flax at
# import time), magenta_rt/audio.py imports jax.numpy, and the MLX backends
# bridge Linen-format checkpoints via flax (hence flax in the mlx extra).
# Don't "simplify" flax out of mlx or expect [mlx] to be jax-free.
[project.optional-dependencies]
jax = ["jax>=0.10.2", "flax>=0.12.7", "optax", "jaxtyping", "typing_extensions"]
mlx = ["mlx", "flax>=0.12.7", "typing_extensions"]
dev = ["jupyter", "ipython", "pytest", "matplotlib", "pytest-cov"]

# Supervised fine-tuning (the trainer drivers under notebooks/sft/). Pair with a
# backend extra, e.g. `pip install magenta-rt[jax,sft]` (nnx) or `[mlx,sft]`.
# `argbind-dbraun` builds the trainer CLIs from `SFTConfig` (and gives
# `--args.save`/`--args.load` YAML replay); `tensorboardX` is the TF-free
# TensorBoard writer for the MLX trainer (see below). `wandb` is optional (logging).
# NOTE: `clu` (TensorBoard metric writers, nnx-only) pulls in TensorFlow, which
# aborts when co-resident with JAX/MLX in one process — so the trainers import it
# lazily and the SFT tests run in a separate CI job. The MLX trainer uses
# `tensorboardX` precisely to avoid that TF co-residence abort.
sft = ["grain", "orbax-checkpoint", "argbind-dbraun>=0.6.0", "tensorboardX", "tqdm"]

# Listener-eval bulk generation
eval = [
    "pandas",
]

[project.scripts]
mrt = "magenta_rt.cli:main"

[build-system]
requires = ["flit_core >= 3.12.0, <4"]
build-backend = "flit_core.buildapi"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.flit.module]
name = "magenta_rt"

[tool.flit.sdist]
exclude = ["core/", "examples/", "tools/", "build/", "scripts/", "tests/", "notebooks/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "checkpoint: requires a real safetensors file in checkpoints/",
    "slow: end-to-end / multi-second tests",
    "gptq: requires quantized weights",
    "bf16: bfloat16 mixed-precision path",
]

[tool.pyink]
line-length = 80
unstable = true
pyink-indentation = 2
pyink-use-majority-quotes = true
